<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="Діаграма фаз втоми, відновлення та суперкомпенсації атлета">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d111c"/>
      <stop offset="100%" stop-color="#151c2e"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5e3a"/>
      <stop offset="50%" stop-color="#ffb347"/>
      <stop offset="80%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="areaSuper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="areaFatigue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5e3a" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ff5e3a" stop-opacity="0.28"/>
    </linearGradient>
  </defs>

  <rect width="960" height="420" rx="20" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="958" height="418" rx="19" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- Заголовок діаграми -->
  <text x="48" y="46" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="19" font-weight="700">Крива гомеостазу та фаза суперкомпенсації (модель Яковлєва)</text>
  <text x="48" y="70" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="13">Оптимальний момент повторного тренувального стимулу припадає на пік адаптаційного резерву (36–72 год)</text>

  <!-- Сітка -->
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="1">
    <line x1="70" y1="120" x2="900" y2="120"/>
    <line x1="70" y1="175" x2="900" y2="175"/>
    <line x1="70" y1="285" x2="900" y2="285"/>
    <line x1="70" y1="340" x2="900" y2="340"/>
  </g>

  <!-- Базова лінія гомеостазу -->
  <line x1="70" y1="230" x2="900" y2="230" stroke="#94a3b8" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="76" y="220" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600">Вихідний функціональний рівень (100%)</text>

  <!-- Заливка фази втоми -->
  <path d="M130 230 C 185 230, 215 338, 285 338 C 365 338, 425 230, 495 230 Z" fill="url(#areaFatigue)"/>

  <!-- Заливка фази суперкомпенсації -->
  <path d="M495 230 C 555 230, 600 118, 675 118 C 750 118, 805 230, 875 230 Z" fill="url(#areaSuper)"/>

  <!-- Головна крива -->
  <path d="M80 230 L130 230 C 185 230, 215 338, 285 338 C 365 338, 435 230, 495 230 C 555 230, 600 118, 675 118 C 750 118, 805 230, 885 230" fill="none" stroke="url(#curveGrad)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Ключові точки -->
  <circle cx="130" cy="230" r="6" fill="#ff5e3a" stroke="#0d111c" stroke-width="2"/>
  <circle cx="285" cy="338" r="7" fill="#ff5e3a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="495" cy="230" r="6" fill="#ffb347" stroke="#0d111c" stroke-width="2"/>
  <circle cx="675" cy="118" r="8" fill="#10b981" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="875" cy="230" r="6" fill="#38bdf8" stroke="#0d111c" stroke-width="2"/>

  <!-- Підписи фаз -->
  <rect x="200" y="354" width="170" height="32" rx="8" fill="#2a161b" stroke="#ff5e3a" stroke-opacity="0.5"/>
  <text x="285" y="375" text-anchor="middle" fill="#fda4af" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600">1. Фаза гострої втоми</text>

  <rect x="405" y="246" width="180" height="32" rx="8" fill="#272215" stroke="#ffb347" stroke-opacity="0.5"/>
  <text x="495" y="267" text-anchor="middle" fill="#fde68a" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600">2. Повне відновлення</text>

  <rect x="572" y="74" width="206" height="34" rx="8" fill="#0d2b24" stroke="#10b981" stroke-opacity="0.7"/>
  <text x="675" y="95" text-anchor="middle" fill="#6ee7b7" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" font-weight="700">3. Пік суперкомпенсації (+8…14%)</text>

  <text x="835" y="208" text-anchor="middle" fill="#7dd3fc" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600">4. Інволюція сліду</text>
  <text x="130" y="256" text-anchor="middle" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="11.5">Стимул</text>
</svg>
